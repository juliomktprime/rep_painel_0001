<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso restrito</title>
<style>
:root{--red:#A91D22;--fg:#F2F1EC;--muted:#A8A69E;--line:#2C3566}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#0B0F26;background-image:radial-gradient(1200px 600px at 15% 0%,#18214D 0%,#0B0F26 62%)}
.card{width:100%;max-width:420px}
.eye{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(36px,9vw,52px);line-height:1;letter-spacing:-.045em;font-weight:800;margin:14px 0 12px}
h1 em{font-style:normal;color:var(--red)}
p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 28px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
input{width:100%;padding:14px 16px;font:inherit;font-size:16px;color:var(--fg);background:#121836;border:1px solid var(--line);border-radius:10px;outline:none}
input:focus{border-color:var(--fg)}
button{margin-top:14px;width:100%;padding:14px;font:inherit;font-weight:800;font-size:15px;color:#fff;background:var(--red);border:0;border-radius:999px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:13px;color:#FF8A8E}
.foot{margin-top:36px;font-size:12px;color:#6E7396;line-height:1.5}
</style></head><body>

<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
var f=document.getElementById('f'),pw=document.getElementById('pw'),bt=document.getElementById('b'),er=document.getElementById('e'),tries=0;
async function unlock(pass){
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.v)},key,b64(P.c));
 return new TextDecoder().decode(pt);
}
f.addEventListener('submit',async function(ev){ev.preventDefault();er.textContent='';bt.disabled=true;bt.textContent='Verificando…';
 var html;
 try{html=await unlock(pw.value);}
 catch(x){tries++;await new Promise(function(r){setTimeout(r,Math.min(8000,700*tries));});er.textContent='Senha incorreta. Tente novamente.';bt.disabled=false;bt.textContent='Entrar';pw.select();return;}
 document.open();document.write(html);document.close();
});
})();
</script></body></html>
